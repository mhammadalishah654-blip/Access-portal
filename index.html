<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Verification | Secure Portal</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff00; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #00ff00; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 85%; background: rgba(0, 20, 0, 0.9); box-shadow: 0 0 30px #00ff00; }
        h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; }
        button { background: #00ff00; color: #000; border: none; padding: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; font-size: 16px; box-shadow: 0 5px 15px rgba(0,255,0,0.3); }
        .warning { color: #ff0000; border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
        .welcome { color: #00e5ff; border-color: #00e5ff; box-shadow: 0 0 30px #00e5ff; }
        #status { line-height: 1.6; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="portal" class="box">
    <h1>System Auth</h1>
    <p id="status">📡 Connecting to Satellite...<br>Waiting for Encryption Key.</p>
    <button id="mainBtn" onclick="startScan()">AUTHENTICATE LOCATION</button>
</div>

<script>
    const LOCATIONS = [
        {lat: 33.887138, lon: 72.503035}, // Haleema Home
        {lat: 33.805359, lon: 72.365496}  // Your Home
    ];
    const FORM_URL = "https://forms.gle/KZFbcGFvHUQip5q19";
    const RADIUS = 100; // 100 meters area (taake signal ka masla na ho)

    function startScan() {
        const status = document.getElementById("status");
        const portal = document.getElementById("portal");
        const btn = document.getElementById("mainBtn");

        // 1. Device Check (Mobile Only)
        if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            status.innerHTML = "⚠️ ERROR: UNAUTHORIZED DEVICE!<br><br>Satellite verification requires a Mobile Device. Access Denied for Laptops.";
            return;
        }

        status.innerText = "🛰️ Verifying Coordinates via Satellite...";

        if (!navigator.geolocation) {
            status.innerText = "ERROR: GPS Hardware Not Found.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                let isMatched = false;
                const userLat = pos.coords.latitude;
                const userLon = pos.coords.longitude;

                LOCATIONS.forEach(loc => {
                    if (getDist(userLat, userLon, loc.lat, loc.lon) <= RADIUS) {
                        isMatched = true;
                    }
                });

                if (isMatched) {
                    portal.className = "box welcome";
                    status.innerHTML = "✅ <b style='font-size:20px;'>ACCESS GRANTED</b><br><br>Hammad Ali Shah welcomes you with a big heart... 🤗✨<br>Redirecting to your special message! 💌";
                    btn.style.display = "none";
                    setTimeout(() => { window.location.href = FORM_URL; }, 4000);
                } else {
                    portal.className = "box warning";
                    status.innerHTML = "🚨 <b>SYSTEM BREACH DETECTED!</b> 🚨<br><br>Unauthorized access from an unknown location. 🕵️‍♂️ Your Device ID has been logged. Do not try again or your mobile will be <b>HACKED</b>! 📱🔥<br><br>Orders from <b>Hammad Ali Shah</b>! EXIT NOW! 🛑👊";
                    btn.innerText = "ABORT IMMEDIATELY";
                    btn.style.background = "red";
                }
            },
            () => {
                alert("ACCESS DENIED: Please turn ON your Location/GPS! 📍 This portal cannot be opened without satellite verification.");
                status.innerText = "STATUS: Waiting for GPS Signal... 🛰️";
            },
            { enableHighAccuracy: true }
        );
    }

    function getDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
