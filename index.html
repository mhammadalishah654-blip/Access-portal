<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Verification | Secure Portal</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff00; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #police-lights { position: fixed; top: 0; left: 0; width: 100%; height: 40px; display: none; z-index: 100; border-bottom: 2px solid white; }
        .box { border: 2px solid #00ff00; padding: 25px; border-radius: 15px; text-align: center; max-width: 400px; width: 85%; background: rgba(0, 15, 0, 0.95); box-shadow: 0 0 30px #00ff00; }
        h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        button { background: #00ff00; color: #000; border: none; padding: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; font-size: 16px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,255,0,0.3); }
        .danger { color: #ff0000; border-color: #ff0000; box-shadow: 0 0 60px #ff0000; background: rgba(40, 0, 0, 0.9); }
        .welcome-box { color: #00e5ff; border-color: #00e5ff; box-shadow: 0 0 40px #00e5ff; }
        @keyframes blink { 0% { background: red; } 50% { background: blue; } 100% { background: red; } }
        .active-lights { display: block !important; animation: blink 0.15s infinite; }
    </style>
</head>
<body>

<div id="police-lights"></div>

<div id="portal" class="box">
    <h1>🛰️ Secure System</h1>
    <p id="status">📡 Connecting to Satellite...<br>Verifying Security Protocols. 🛡️</p>
    <button id="mainBtn" onclick="startScan()">UNLOCK MESSAGE 🔓</button>
</div>

<script>
    const LOCATIONS = [
        {lat: 33.887138, lon: 72.503035}, // Haleema Home
        {lat: 33.805359, lon: 72.365496}  // Your Home
    ];
    const FORM_URL = "https://forms.gle";
    const RADIUS = 100; 

    function startScan() {
        const status = document.getElementById("status");
        const portal = document.getElementById("portal");
        const btn = document.getElementById("mainBtn");
        const lights = document.getElementById("police-lights");

        // 1. Laptop/Desktop Check
        if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            status.innerHTML = "⚠️ <b>ACCESS DENIED!</b> ⚠️<br><br>Satellite verification requires a <b>Mobile Device</b>. Please use your phone to open this portal. 📱";
            return;
        }

        status.innerText = "Tracking Satellite Coordinates... 🛰️";

        // 2. Location/GPS Check
        if (!navigator.geolocation) {
            status.innerHTML = "❌ Error: GPS Hardware not found.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                let isMatched = false;
                const uLat = pos.coords.latitude;
                const uLon = pos.coords.longitude;

                LOCATIONS.forEach(loc => {
                    const d = getDist(uLat, uLon, loc.lat, loc.lon);
                    if (d <= RADIUS) isMatched = true;
                });

                if (isMatched) {
                    // --- SUCCESS WELCOME ---
                    portal.className = "box welcome-box";
                    status.innerHTML = "✅ <b>LOCATION VERIFIED!</b> ✨<br><br>Hammad Ali Shah welcomes you... 🤗💖<br>Opening your private message! 💌🎁";
                    btn.style.display = "none";
                    setTimeout(() => { window.location.href = FORM_URL; }, 4000);
                } else {
                    // --- DANGER HACKER MODE ---
                    portal.className = "box danger";
                    lights.classList.add("active-lights");
                    
                    // Vibration (approx 3 mins)
                    if (navigator.vibrate) { 
                        let count = 0;
                        let vibInterval = setInterval(() => {
                            navigator.vibrate(500);
                            count++;
                            if(count > 180) clearInterval(vibInterval); 
                        }, 1000);
                    }
                    
                    status.innerHTML = "🚨 <b>SYSTEM BREACH! HACKING...</b> 🚨<br><br>Unauthorized person detected! 🕵️‍♂️<br><b>WARNING:</b> Your camera is now ACTIVE! 📸 Your LIVE VIDEO is being sent to Hammad Ali Shah! 🛰️📽️<br><br>Your mobile is now HACKED! 📱🔥<br><b>EXIT IMMEDIATELY!</b> 🛑👊";
                    btn.innerText = "ABORT SYSTEM (EXIT)";
                    btn.style.background = "red";
                    btn.onclick = () => { window.location.href = "https://google.com"; };
                }
            },
            () => { 
                // Location OFF Message
                alert("📍 ACCESS DENIED: Please TURN ON your Mobile Location (GPS) to unlock this portal! 🛰️");
                status.innerHTML = "⚠️ <b>SIGNAL LOST!</b> 🛰️<br><br>Please turn ON your <b>GPS/Location</b> and try again to verify your identity. 📍";
            },
            { enableHighAccuracy: true }
        );
    }

    function getDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
